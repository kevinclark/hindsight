# Builds Hindsight for Mac, Windows and Linux from a commit that passed the tests, and on main publishes it as a GitHub release
# (v0.1.<commit count>) that electron-updater and the app's update banner read. A push to claude/auto-release builds and uploads
# artifacts only. Run it by hand (Actions > release > Run workflow) for the same artifacts from any branch; only main publishes.
# Mac is signed and notarized when the MAC_CSC_LINK secret exists, ad hoc otherwise (docs/release.md).
name: release

on:
  push:
    branches:
      - main
      - claude/auto-release
    paths:
      - src/**
      - electron/**
      - package*.json
      - vite*.ts
      - index.html
      - svelte.config.js
      - tsconfig.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

# Two merges never race for one version number (per branch: a branch build never displaces a pending main release).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # No install scripts: the tests need neither Electron's download nor a native build.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx vitest run
      - run: npm run check

  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-14
            name: mac
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      pkg_version: ${{ steps.version.outputs.pkg_version }}
    defaults:
      run:
        shell: bash
    steps:
      # The whole history: the version is the commit count (a depth-1 clone would always say 1).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: Version
        id: version
        run: |
          pkg=$(node -p "require('./package.json').version")
          v="0.1.$(git rev-list --count HEAD)"
          npm version "$v" --no-git-tag-version --allow-same-version
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "pkg_version=$pkg" >> "$GITHUB_OUTPUT"
      # No GH_TOKEN or GITHUB_TOKEN anywhere in the build steps: electron-builder publishes on CI when it finds one.
      - name: Build and package (Mac)
        if: matrix.name == 'mac'
        env:
          HINDSIGHT_GOOGLE_CLIENT_ID: ${{ secrets.HINDSIGHT_GOOGLE_CLIENT_ID }}
          HINDSIGHT_GOOGLE_CLIENT_SECRET: ${{ secrets.HINDSIGHT_GOOGLE_CLIENT_SECRET }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          sign=()
          if [ -n "$MAC_CSC_LINK" ]; then
            export CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
            export HINDSIGHT_MAC_SIGNED=true
            sign=(-c.mac.notarize=true)   # identity found in CSC_LINK; -c.mac.identity=null would skip signing
            echo signed > signing-mac.txt
          else
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
            sign=(-c.mac.identity=-)   # ad hoc
            echo unsigned > signing-mac.txt
          fi
          npm run build:app
          npx electron-builder --mac dmg zip --arm64 --x64 --publish never "${sign[@]}"
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          test -e release/latest-mac.yml
          if [ -n "$MAC_CSC_LINK" ]; then codesign -dv --verbose=2 release/mac-arm64/Hindsight.app 2>&1 | grep -E 'Authority=Developer ID Application|TeamIdentifier'; fi
          mv signing-mac.txt release/
      - name: Build and package (Windows)
        if: matrix.name == 'windows'
        env:
          HINDSIGHT_GOOGLE_CLIENT_ID: ${{ secrets.HINDSIGHT_GOOGLE_CLIENT_ID }}
          HINDSIGHT_GOOGLE_CLIENT_SECRET: ${{ secrets.HINDSIGHT_GOOGLE_CLIENT_SECRET }}
        run: |
          npm run build:app
          npx electron-builder --win nsis --x64 --publish never
          test -e release/latest.yml
      - name: Build and package (Linux)
        if: matrix.name == 'linux'
        env:
          HINDSIGHT_GOOGLE_CLIENT_ID: ${{ secrets.HINDSIGHT_GOOGLE_CLIENT_ID }}
          HINDSIGHT_GOOGLE_CLIENT_SECRET: ${{ secrets.HINDSIGHT_GOOGLE_CLIENT_SECRET }}
        run: |
          npm run build:app
          npx electron-builder --linux AppImage --x64 --publish never
          test -e release/latest-linux.yml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hindsight-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/latest*.yml
            release/*.blockmap
            release/signing-*.txt
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: files
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PKG_VERSION: ${{ needs.build.outputs.pkg_version }}
        run: |
          cd files
          mac_signed=false
          if [ "$(cat signing-mac.txt)" = signed ]; then mac_signed=true; fi
          {
            echo "Hindsight $VERSION, built from commit ${GITHUB_SHA::12} after the test suite passed."
            echo
            echo "The commit's package.json says version $PKG_VERSION; the build sets the version to $VERSION (0.1.<commits on main>) before packaging."
            echo
            echo "Windows and Linux builds update themselves. A signed and notarized Mac build does too; an unsigned one shows a banner and you download the new dmg."
            echo
            echo "sha256:"
            for f in *.dmg *.zip *.exe *.AppImage latest*.yml *.blockmap; do
              [ -e "$f" ] && echo "- $f: $(sha256sum "$f" | cut -d' ' -f1)"
            done
            echo
            echo "First time you open a download (an update that installs itself never asks):"
            if [ "$mac_signed" = true ]; then
              echo "- Mac (Hindsight-$VERSION-mac-*.dmg, arm64 for Apple silicon, x64 for Intel): signed and notarized, drag Hindsight to Applications and open it. If your copy is older and unsigned, download this one once; later ones install themselves."
            else
              echo "- Mac (Hindsight-$VERSION-mac-*.dmg, arm64 for Apple silicon, x64 for Intel): not signed. Drag Hindsight to Applications and open it. If it says it can't be opened, open System Settings, Privacy & Security, click Open Anyway."
            fi
            echo "- Windows (.exe, not signed): if it says \"Windows protected your PC\", click More info, then Run anyway."
            echo "- Linux (.AppImage): make it executable (chmod +x), then run it."
          } > ../notes.md
          args=()
          for f in *.dmg *.zip *.exe *.AppImage latest*.yml *.blockmap; do [ -e "$f" ] && args+=("$f"); done
          # A draft until every file is attached: the app and electron-updater never see a release without its latest*.yml.
          gh release create "v$VERSION" "${args[@]}" --draft \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Hindsight $VERSION" --notes-file ../notes.md
          gh release edit "v$VERSION" --draft=false --latest --repo "$GITHUB_REPOSITORY"
