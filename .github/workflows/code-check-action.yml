# Tests action.yml on a small repo of invented code built in the job: the counts it reports, and that fail-on: new fails.
# It never runs on a real team's code, so no real finding counts are published from here.
name: code-check-action

on:
  push:
    paths:
      - action.yml
      - scripts/code-check.ts
      - scripts/make-code-check-sample.sh
      - src/code/**
      - package*.json
      - .github/workflows/code-check-action.yml
  pull_request:
    paths:
      - action.yml
      - scripts/code-check.ts
      - scripts/make-code-check-sample.sh
      - src/code/**
      - package*.json
      - .github/workflows/code-check-action.yml

permissions:
  contents: read
  pull-requests: write          # for the step that tests the comment

# Two overlapping runs on one pull request could each find no comment and post one: the newer run replaces the older.
concurrency:
  group: code-check-action-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Two commits of invented Java, outside the checkout. At the head: 13 findings, 12 new, 1 fixed.
      - name: Build the sample repo
        id: sample
        run: |
          base=$(sh scripts/make-code-check-sample.sh "$RUNNER_TEMP/sample")
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Run the action, report only
        id: report
        uses: ./
        with:
          path: ${{ runner.temp }}/sample
          base: ${{ steps.sample.outputs.base }}
          fail-on: none

      - name: Check the counts
        env:
          FINDINGS: ${{ steps.report.outputs.findings }}
          NEW: ${{ steps.report.outputs.new }}
          FIXED: ${{ steps.report.outputs.fixed }}
          COMPARED: ${{ steps.report.outputs.compared }}
        run: |
          echo "findings=$FINDINGS new=$NEW fixed=$FIXED compared=$COMPARED"
          test "$FINDINGS" = 13 && test "$NEW" = 12 && test "$FIXED" = 1 && test "$COMPARED" = true

      # No base input: the default BASE expression gives this event's own base commit, which the sample repo doesn't
      # have, and the sample has no origin to fetch it from. So this is the "not compared" path: every finding is
      # reported, and the step does not fail.
      - name: Run the action with no base
        id: nobase
        uses: ./
        with:
          path: ${{ runner.temp }}/sample

      - name: Check that nothing was compared
        env:
          FINDINGS: ${{ steps.nobase.outputs.findings }}
          COMPARED: ${{ steps.nobase.outputs.compared }}
        run: |
          echo "findings=$FINDINGS compared=$COMPARED"
          test "$FINDINGS" = 13 && test "$COMPARED" = false

      - name: Run the action again with fail-on new (it must fail)
        id: blocking
        continue-on-error: true
        uses: ./
        with:
          path: ${{ runner.temp }}/sample
          base: ${{ steps.sample.outputs.base }}
          fail-on: new

      - name: Check that it failed
        env:
          OUTCOME: ${{ steps.blocking.outcome }}
        run: |
          echo "fail-on: new outcome: $OUTCOME"
          test "$OUTCOME" = failure

      # The comment. On a push it must print "not a pull request" and post nothing. On a pull request it posts on this
      # pull request (the sample has 12 new findings): the live test of posting, and of editing on the second run.
      - name: Run the action with comment true
        id: comment
        uses: ./
        with:
          path: ${{ runner.temp }}/sample
          base: ${{ steps.sample.outputs.base }}
          comment: 'true'

      - name: Check the comment
        env:
          OUTCOME: ${{ steps.comment.outcome }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "comment step outcome: $OUTCOME"
          test "$OUTCOME" = success
          # A pull request from a fork gets no comment (read-only token), so only ours are checked.
          if [ "$EVENT" = pull_request ] && [ "$HEAD_REPO" = "$GH_REPO" ]; then
            count=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
              --jq '.[] | select(.body | startswith("<!-- hindsight-code-check -->")) | .id' | wc -l | tr -d ' ')
            echo "comments with the marker: $count"
            test "$count" = 1
          fi
