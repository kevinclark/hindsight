# Builds the one-file robot snapshot program for Mac and Windows from committed source that passed the tests.
# Run it by hand (Actions > robot-snapshot > Run workflow) to get the zips as artifacts, or push a tag
# robot-snapshot-vX.Y.Z to also publish them as a release.
name: robot-snapshot

on:
  workflow_dispatch:
  push:
    tags:
      - 'robot-snapshot-v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Every build dependency is pinned by hash, for both runners: scripts/requirements-build.in says how to regenerate it.
      # Wheels only (no build step runs), and reinstalled even if the runner's Python already has one, so each is checked.
      - run: python -m pip install --require-hashes --only-binary :all: --ignore-installed -r scripts/requirements-build.txt
      # The few tests that need POSIX (the fake owlets are #! scripts) skip themselves on Windows.
      - run: python -m unittest discover -s tests -p "test_*.py"
      - name: Build
        shell: bash
        run: python scripts/build-robot-snapshot.py --out dist-snapshot
      - name: Smoke test the built program
        shell: bash
        run: |
          binary=dist-snapshot/robot-snapshot
          if [ "$RUNNER_OS" = "Windows" ]; then binary=dist-snapshot/robot-snapshot.exe; fi
          python scripts/smoke-robot-snapshot.py "$binary" --build "$(git rev-parse --short=12 HEAD)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: robot-snapshot-${{ runner.os }}
          path: dist-snapshot/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/robot-snapshot-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: zips
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd zips
          mac=$(sha256sum robot-snapshot-mac.zip | cut -d' ' -f1)
          win=$(sha256sum robot-snapshot-windows.zip | cut -d' ' -f1)
          cat > ../notes.md <<NOTES
          Read-only snapshot of a robot's CTRE devices. Python is bundled inside. Guide: https://github.com/kevinclark/hindsight/blob/main/docs/robot-snapshot.md

          Built from commit ${GITHUB_SHA::12}, after the test suite passed.

          sha256:
          - robot-snapshot-mac.zip: $mac
          - robot-snapshot-windows.zip: $win

          First time you open it (the files are not signed):
          - Mac: unzip, double-click robot-snapshot. If it says it can't be opened, open System Settings, Privacy & Security, click Open Anyway.
          - Windows: unzip, double-click robot-snapshot.exe. If it says "Windows protected your PC", click More info, then Run anyway.

          It asks for your team number (press Enter if the robot is plugged in by USB).
          NOTES
          gh release create "$GITHUB_REF_NAME" robot-snapshot-mac.zip robot-snapshot-windows.zip \
            --repo "$GITHUB_REPOSITORY" --title "Robot snapshot ${GITHUB_REF_NAME#robot-snapshot-v}" --notes-file ../notes.md
