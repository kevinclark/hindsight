repositories {
    maven { url 'https://maven.ctr-electronics.com/release/' }
}

def phoenix = "com.ctre.phoenix6:wpiapi-java:$phoenixVersion"

dependencies {
    compileOnly phoenix
    testImplementation phoenix
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'hindsight-companion-java'
            from components.java
        }
    }
}

registerVendordep(project, 'HindsightCompanion', 'e3405636-f9d0-4ece-a8f4-d4b45a391885', [
    akitRequirement,
    [uuid: 'e995de00-2c64-4df5-8831-c1441420ff19', offlineFileName: 'Phoenix6-frc2026-latest.json',
     onlineUrl: 'https://maven.ctr-electronics.com/release/com/ctre/phoenix6/latest/Phoenix6-frc2026-latest.json'],
])
